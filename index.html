<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoPoT</title>
<meta name="theme-color" content="#f4f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoPoT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👶%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#1d2433; --soft:#667085; --line:#e1e7ef;
  --pipi:#2f8fdb; --caca:#b4781f; --vomi:#5e9e3a; --biberon:#e5527e; --temperature:#e8590c;
  --accent:#3b5bdb; --danger:#c62828; --s1:#e5527e; --s2:#0f9d8a;
  --warn-bg:#fff3cd; --warn-ink:#6b4e00;
  --radius:22px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#11151d; --card:#1a202b; --ink:#eef2f8; --soft:#9aa6b8; --line:#2a3342;
         --accent:#6f8cff; --warn-bg:#4a3a10; --warn-ink:#ffe08a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 48px}
h1,h2,h3{margin:0}
h2{font-size:21px}
h3{font-size:16px;margin-top:22px}
.soft{color:var(--soft)}
.small{font-size:13px}
button{font:inherit;color:inherit}

/* barre du haut */
.lft{display:flex;align-items:center;gap:12px}
.dbd{z-index:25}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:30;transform:translateX(-105%);transition:transform .2s ease;
  padding:calc(env(safe-area-inset-top) + 16px) 0 16px;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.25)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dh{font-size:22px;font-weight:800;padding:6px 20px 14px}
.mi{display:flex;gap:12px;align-items:center;border:0;background:none;color:inherit;font:inherit;font-size:17px;padding:13px 20px;text-align:left;cursor:pointer;width:100%}
.mi.sub{padding-left:34px}
.mi.on{background:color-mix(in srgb,var(--accent) 15%,var(--card));font-weight:700}
.mt{padding:18px 20px 4px;font-weight:800;font-size:14px;color:var(--soft)}
.icon.sm{width:40px;height:40px;font-size:16px}
.icon:disabled{opacity:.35;cursor:default}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}
.ptitle{flex:1;text-align:center;font-weight:800;font-size:16px}
.ptitle::first-letter{text-transform:uppercase}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px 6px}
.chartcard svg{display:block;width:100%;height:auto}
.chartcard svg text{fill:var(--soft);font-size:10px;font-family:inherit}
.chartcard .gl{stroke:var(--line);stroke-width:1}
.chartcard .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.chartcard .dt{stroke:var(--card);stroke-width:1.5}
.chartcard .emp{fill:none;stroke:var(--soft);stroke-width:1.2}
.chartcard .selcol{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.chartcard .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;padding:0 10px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.detail{margin-top:12px}
.chartcard .ref{stroke:var(--temperature);stroke-width:1;stroke-dasharray:4 3;opacity:.8}
.chartcard .ring{fill:color-mix(in srgb,var(--temperature) 25%,transparent)}
button.tl{width:100%;border:0;border-left:0;border-right:0;border-bottom:0;background:none;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer;justify-content:space-between}
button.tl.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.detail h3{margin:0 0 6px}
.detail .hint{margin:0;text-align:center}
.dl{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.dl .t{font-variant-numeric:tabular-nums;color:var(--soft);min-width:44px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.top .hi{font-size:13px;color:var(--soft);font-weight:600}
.top .sub{font-size:26px;font-weight:800;letter-spacing:-.01em}
.icon{border:0;background:var(--card);border:1px solid var(--line);width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}

/* bandeau hors connexion */
.banner{display:none;position:sticky;top:0;z-index:10;background:var(--warn-bg);color:var(--warn-ink);
  padding:8px 14px;font-size:14px;font-weight:600;text-align:center}
.banner.on{display:block}

/* tableau de bord */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{--c:var(--accent);border:2.5px solid var(--c);background:var(--card);
  background:color-mix(in srgb,var(--c) 13%,var(--card));border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:10px;
  transition:transform .08s ease}
.tile:active{transform:scale(.96)}
.tile.big{height:178px}
.grid .wide{grid-column:1/-1}
.tile.small{height:108px}
.tile .em{font-size:60px;line-height:1}
.tile.small .em{font-size:34px}
.tile .nm{font-weight:800;font-size:18px}
.tile.small .nm{font-size:15px}
.tile .meta{font-size:12px;color:var(--soft);text-align:center}
.tile.small .meta{font-size:11px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:16px;
  background:var(--accent);color:#fff;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--card);background:color-mix(in srgb,var(--accent) 12%,var(--card));
  color:var(--ink);border:2px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{background:transparent;color:var(--soft)}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px}
.row .btn{margin-top:12px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}

/* champs */
.inp{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;
  padding:13px 14px;font:inherit;font-size:16px;margin-top:8px}
.inp:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.inp.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;text-align:center;font-size:21px}
textarea.inp{min-height:76px;resize:vertical}
.lbl{display:block;margin-top:18px;font-weight:700;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
.card p{margin:6px 0 4px}

/* accueil */
.hero{text-align:center;padding:26px 0 6px}
.hero .logo{font-size:64px;line-height:1}
.hero h1{font-size:34px;font-weight:800;margin-top:6px}

/* choix de couleur */
.photo-row{display:flex;gap:10px;margin:8px 0 4px}
.photo-row label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:12px 6px;font-weight:600;cursor:pointer;text-align:center;font-size:15px}
.photo-row input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-prev{display:flex;align-items:center;gap:12px;margin-top:8px}
.photo-prev img,.photo-big{border-radius:14px;object-fit:cover}
.photo-prev img{width:84px;height:84px}
.photo-big{width:100%;max-height:360px;margin:8px 0;background:var(--line)}
.vl{display:flex;gap:6px;margin:8px 0 2px}
.vl button{flex:1;background:none;border:0;font-size:34px;padding:4px 0;cursor:pointer;filter:grayscale(1);opacity:.35;transition:opacity .15s}
.vl button.on{filter:none;opacity:1}
.vlabel{text-align:center;font-weight:700;min-height:24px;margin:0 0 4px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin:8px 0 4px}
.swb{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:14px}
.sw{width:50px;height:50px;border-radius:50%;border:2px solid var(--line)}
.swb.on .sw{outline:4px solid var(--accent);outline-offset:2px}
.swl{font-size:12.5px;color:var(--soft);text-align:center;line-height:1.15}
.swb.on .swl{color:var(--ink);font-weight:700}

/* listes */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.row-item{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.row-item .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;color:var(--soft)}
.row-item .e{font-size:26px;line-height:1}
.row-item .b{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.row-item .d{font-size:14px;color:var(--soft)}
.row-item .c{font-size:14px;font-style:italic;overflow-wrap:anywhere}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;border:1px solid var(--line);vertical-align:-1px}
.day{margin:20px 0 4px;font-size:15px;color:var(--soft);font-weight:700}
.day::first-letter{text-transform:uppercase}
.empty{text-align:center;color:var(--soft);padding:26px 10px}

/* fenêtre du bas */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.backdrop.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92dvh;overflow:auto;
  background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  z-index:21;transform:translateY(105%);visibility:hidden;transition:transform .2s ease,visibility .2s}
.sheet.on{transform:none;visibility:visible}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em}
.bigcode{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;
  padding:18px 6px;margin:12px 0 4px;background:var(--bg);border-radius:18px;border:2px dashed var(--line)}
pre.log{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:12px;padding:12px;font-size:12.5px;max-height:44dvh;overflow:auto}

/* message */
.toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;
  background:#222a38;color:#fff;border-radius:16px;padding:14px 16px;font-weight:600;z-index:40;
  opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.toast.on{opacity:1;transform:none}
.toast.err{background:var(--danger)}
.center{text-align:center;padding:60px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="banner" class="banner"></div>
<div id="app"></div>
<div id="backdrop" class="backdrop" data-act="close"></div>
<div id="dbackdrop" class="backdrop dbd" data-act="menuclose"></div>
<nav id="drawer" class="drawer" aria-label="Menu"></nav>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* ===== Réglages de connexion à la base (clé publique : sans danger à cet endroit) ===== */
const SUPABASE_URL = 'https://fdowvvedysoskszkycte.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb3d2dmVkeXNvc2tzemt5Y3RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTYwNDQsImV4cCI6MjEwNzI5MjA0NH0.pIPak4IZpMqA6wP0jqGwvJSGcib-TnwHjAhxvbXR9Nc';
const VERSION = '2.1';
const PAGE = 40;

/* ===== Les choix proposés dans les formulaires ===== */
const KINDS = {
  pipi:    { emoji: '💧', label: 'Pipi',    art: 'un pipi' },
  caca:    { emoji: '💩', label: 'Caca',    art: 'un caca' },
  vomi:    { emoji: '🤢', label: 'Vomi',    art: 'un vomi' },
  biberon: { emoji: '🍼', label: 'Alimentation', art: 'une alimentation' },
  temperature: { emoji: '🌡️', label: 'Température', art: 'une température' }
};
const COLORS = {
  pipi: [['jaune très clair', '#fbf3b9'], ['jaune', '#f2d544'], ['jaune foncé / orangé', '#e08a1e'], ['rouge', '#d32f2f']],
  caca: [['vert foncé', '#787c1f'], ['vert clair', '#b2c25b'], ['marron', '#b4652d'], ['marron foncé', '#7a3413'],
         ['jaune moutarde', '#f6d447'], ['gris', '#bba094'], ['rouge', '#e03338'], ['noir', '#2b170d']]
};
COLORS.vomi = [['blanc', '#f1ece0'], ['marron', '#7a4a24'], ['rouge', '#d32f2f']];
// anciens libellés gardés uniquement pour bien afficher les entrées déjà enregistrées
const OLD_COLORS = { vomi: [['jaune moutarde', '#d9a21b'], ['vert', '#5b8a3c'], ['noir', '#1f1f1f'], ['blanc / très pâle', '#f1ece0']] };
const TEXTURES = ['Normal', 'Mou', 'Liquide', 'Dur', 'Diarrhée'];
// quantité de vomi : 1 à 5 smileys (stockée dans la colonne « texture »)
const VLEVELS = ['Petit rejet', 'Moins 1/2 Bib', '1/2 Bib', '+ 1/2 Bib', 'Tout le Bib'];

/* ===== Petits outils ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const inputValue = d => dayKey(d) + 'T' + hhmm(d);
const fmtQ = v => String(Math.round(Number(v) * 10) / 10).replace('.', ',');
const numOrNull = x => { const v = parseFloat(String(x).replace(',', '.')); return isFinite(v) && v >= 0 ? Math.round(v * 10) / 10 : null; };
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.floor(Math.random() * 16); return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const dayLabel = d => {
  const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  const k = dayKey(d);
  if (k === dayKey(t)) return "Aujourd'hui";
  if (k === dayKey(y)) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* rien */ } }
};

/* ===== État de l'application ===== */
const S = {
  sb: null, user: null, familyId: null, code: null,
  children: [], childId: null, today: [],
  hist: { items: [], more: false, loading: false, kind: 'all', childId: null, day: '' },
  view: 'loading', errText: '', form: null,
  queue: store.get('popot-queue', []), offline: false
};
let flushing = false, rtTimer = null, toastTimer = null;

/* ===== Journal des erreurs : un seul jour conservé, en français ===== */
function log(text, tech) {
  let l = store.get('popot-log', null);
  if (!l || l.day !== dayKey(new Date())) l = { day: dayKey(new Date()), items: [] };
  l.items.push({ t: new Date().toISOString(), text: text, tech: String(tech || '') });
  if (l.items.length > 200) l.items.shift();
  store.set('popot-log', l);
}
function todayLog() {
  const l = store.get('popot-log', null);
  if (l && l.day === dayKey(new Date())) return l.items;
  if (l) store.del('popot-log');
  return [];
}

/* ===== Traduction des erreurs techniques en messages clairs ===== */
function frError(err) {
  const msg = String((err && (err.message || err.error_description || err.msg)) || err || '');
  const code = String((err && (err.code || err.error_code)) || '');
  const status = err && err.status;
  if (!navigator.onLine) return { kind: 'offline', text: "Pas de connexion internet. Vos ajouts sont gardés sur ce téléphone et seront envoyés dès que le réseau revient." };
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(msg))
    return { kind: 'down', text: "Le service ne répond pas. Il est peut-être en pause (après une semaine sans utilisation). Veuillez contacter votre administrateur pour qu'il le réactive." };
  if (/read-only|quota|exceed|disk full|payment required/i.test(msg) || status === 402)
    return { kind: 'quota', text: "Cette action n'a pas pu être réalisée car le volume de données est trop important. Veuillez contacter votre administrateur." };
  if (code === 'anonymous_provider_disabled' || /anonymous sign-ins are disabled/i.test(msg))
    return { kind: 'config', text: "La connexion automatique n'est pas activée sur la base de données. Veuillez contacter votre administrateur." };
  if (/code famille inconnu/i.test(msg))
    return { kind: 'code', text: "Ce code famille n'existe pas. Vérifiez-le et réessayez." };
  if (code === '42501' || /row-level security|permission denied/i.test(msg))
    return { kind: 'denied', text: "Action non autorisée pour ce téléphone. Essayez de rejoindre à nouveau la famille avec son code." };
  if (status === 401 || status === 403 || /jwt/i.test(msg))
    return { kind: 'auth', text: "La session a expiré. Rechargez la page. Si le problème continue, veuillez contacter votre administrateur." };
  return { kind: 'other', text: "Une erreur inattendue est survenue. Veuillez réessayer ou contacter votre administrateur." };
}
function fail(err, ctx) {
  const f = frError(err);
  log(ctx + ' : ' + f.text, err && (err.message || err));
  toast(f.text, 'err');
  return f;
}

/* ===== Messages et fenêtre du bas ===== */
function toast(text, type) {
  const el = $('#toast');
  el.textContent = text;
  el.className = 'toast on ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, type === 'err' ? 8000 : 2600);
}
function openSheet(html) {
  $('#sheet').innerHTML = html;
  $('#sheet').classList.add('on');
  $('#backdrop').classList.add('on');
  $('#sheet').scrollTop = 0;
}
function closeSheet() {
  $('#sheet').classList.remove('on');
  $('#backdrop').classList.remove('on');
  S.form = null;
}
function renderBanner() {
  const parts = [];
  if (!navigator.onLine || S.offline) parts.push('📴 Hors connexion');
  if (S.queue.length) parts.push('⏳ ' + S.queue.length + (S.queue.length > 1 ? ' entrées en attente' : ' entrée en attente') + " d'envoi");
  const b = $('#banner');
  b.innerHTML = parts.map(p => '<div>' + p + '</div>').join('');
  b.className = parts.length ? 'banner on' : 'banner';
}

/* ===== Enfants ===== */
const childName = c => (c && (c.first_name || c.label)) || '';
const curChild = () => S.children.find(c => c.id === S.childId) || S.children[0] || null;
const childNameById = id => childName(S.children.find(c => c.id === id));
const colorHex = (kind, name) => { const f = (COLORS[kind] || []).concat(OLD_COLORS[kind] || []).find(x => x[0] === name); return f ? f[1] : 'transparent'; };

/* ===== Écrans ===== */
function viewLoading() { return '<div class="center"><div style="font-size:56px">👶</div><p class="soft">Chargement…</p></div>'; }

function viewError() {
  return '<div class="center"><div style="font-size:56px">😕</div><h2>Impossible de continuer</h2><p class="soft">' + esc(S.errText) +
    '</p><button class="btn" data-act="retry">Réessayer</button><button class="btn ghost" data-act="logs">Voir le journal des erreurs</button></div>';
}

function viewWelcome() {

/* ===== Module 2 : suivi dans le temps (courbes) ===== */
const STATS = {
  alim: { title: 'Alimentation', emoji: '🍼', kind: 'biberon' },
  caca: { title: 'Caca', emoji: '💩', kind: 'caca' },
  pipi: { title: 'Pipi', emoji: '💧', kind: 'pipi' },
  temp: { title: 'Température', emoji: '🌡️', kind: 'temperature' }
};
// couleurs classées de la plus grave à la moins grave (sert à départager une égalité)
const GRAVE = {
  caca: ['rouge', 'noir', 'gris', 'marron foncé', 'marron', 'vert foncé', 'jaune moutarde', 'vert clair'],
  pipi: ['rouge', 'jaune foncé / orangé', 'jaune', 'jaune très clair'],
  vomi: ['rouge', 'marron', 'blanc']
};
const SCALES = [['day', 'Jour'], ['week', 'Semaine'], ['month', 'Mois'], ['year', 'Année']];
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const fr = (d, o) => d.toLocaleDateString('fr-FR', o);

function periodOf(scale, off) {
  const now = new Date(), t = sod(now);
  let start, end, n, title, bucketOf, label, btitle;
  if (scale === 'day') {
    start = new Date(t.getFullYear(), t.getMonth(), t.getDate() + off);
    end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
    n = 24;
    title = off >= -1 ? dayLabel(start) + ' · ' + fr(start, { day: 'numeric', month: 'long' }) : dayLabel(start);
    bucketOf = d => d.getHours();
    label = i => (i % 3 === 0 ? i + 'h' : '');
    btitle = i => 'De ' + i + 'h à ' + (i + 1) + 'h';
  } else if (scale === 'week') {
    const dow = (t.getDay() + 6) % 7;
    start = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow + off * 7);
    end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
    n = 7;
    const last = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    title = (off === 0 ? 'Cette semaine · ' : '') + 'du ' + fr(start, { day: 'numeric', month: 'short' }) + ' au ' + fr(last, { day: 'numeric', month: 'short' });
    bucketOf = d => Math.round((sod(d) - start) / 864e5);
    label = i => ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'][i];
    btitle = i => fr(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), { weekday: 'long', day: 'numeric', month: 'long' });
  } else if (scale === 'month') {
    start = new Date(t.getFullYear(), t.getMonth() + off, 1);
    end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
    n = Math.round((end - start) / 864e5);
    title = fr(start, { month: 'long', year: 'numeric' });
    bucketOf = d => d.getDate() - 1;
    label = i => (i === 0 || (i + 1) % 5 === 0 ? String(i + 1) : '');
    btitle = i => fr(new Date(start.getFullYear(), start.getMonth(), i + 1), { weekday: 'long', day: 'numeric', month: 'long' });
  } else {
    start = new Date(t.getFullYear() + off, 0, 1);
    end = new Date(start.getFullYear() + 1, 0, 1);
    n = 12;
    title = String(start.getFullYear());
    bucketOf = d => d.getMonth();
    label = i => 'JFMAMJJASOND'[i];
    btitle = i => fr(new Date(start.getFullYear(), i, 1), { month: 'long', year: 'numeric' });
  }
  const last = now < start ? -1 : now >= end ? n - 1 : bucketOf(now);
  return { start, end, n, title, bucketOf, label, btitle, last };
}

async function loadStat(silent) {
  const st = S.stat;
  if (!st) return;
  const p = periodOf(st.scale, st.offset), req = ++st.req;
  if (!silent) { st.loading = true; st.loaded = false; st.failed = false; st.items = []; render(); }
  try {
    let all = [], from = 0;
    for (;;) {
      const r = await S.sb.from('entries').select('id,occurred_at,color,texture,quantity_drunk,quantity_eaten,temperature,comment')
        .eq('family_id', S.familyId).eq('child_id', S.childId).eq('kind', STATS[st.key].kind)
        .gte('occurred_at', p.start.toISOString()).lt('occurred_at', p.end.toISOString())
        .order('occurred_at', { ascending: true }).range(from, from + 999);
      if (r.error) throw r.error;
      all = all.concat(r.data);
      if (r.data.length < 1000) break;
      from += 1000;
    }
    if (S.stat !== st || req !== st.req) return;
    st.items = all; st.failed = false; st.loaded = true;
  } catch (err) {
    if (S.stat !== st || req !== st.req) return;
    st.failed = true;
    fail(err, 'Chargement des courbes');
  }
  st.loading = false;
  render();
}

function statBuckets(st, p) {
  const B = Array.from({ length: p.n }, () => ({ items: [] }));
  st.items.forEach(it => { const i = p.bucketOf(new Date(it.occurred_at)); if (i >= 0 && i < p.n) B[i].items.push(it); });
  return B;
}

// couleur la plus représentée ; en cas d'égalité, la plus grave
function dominantColor(kind, items) {
  const cnt = {};
  items.forEach(it => { if (it.color) cnt[it.color] = (cnt[it.color] || 0) + 1; });
  const names = Object.keys(cnt);
  if (!names.length) return null;
  const order = GRAVE[kind] || [];
  const rank = c => { const i = order.indexOf(c); return i < 0 ? 99 : i; };
  names.sort((a, b) => cnt[b] - cnt[a] || rank(a) - rank(b));
  return names[0];
}

function niceStep(max, integer) {
  if (!(max > 0)) max = integer ? 4 : 10;
  let step = max / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(step)));
  step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= step - 1e-9);
  if (integer) step = Math.max(1, Math.ceil(step));
  return step;
}
const sumOf = (items, k) => items.reduce((a, it) => a + (Number(it[k]) || 0), 0);

function chartSvg(st, p, B) {
  const alim = st.key === 'alim';
  const W = 360, H = 230, L = 40, R = alim ? 40 : 14, T = 20, Bm = 28;
  const pw = W - L - R, ph = H - T - Bm, cw = pw / p.n;
  const X = i => L + (i + 0.5) * cw;
  const series = alim
    ? [{ unit: 'ml', color: 'var(--s1)', vals: B.map(b => sumOf(b.items, 'quantity_drunk')) },
       { unit: 'g', color: 'var(--s2)', vals: B.map(b => sumOf(b.items, 'quantity_eaten')) }]
    : [{ unit: '', color: 'var(--ink)', vals: B.map(b => b.items.length) }];
  series.forEach(s => { s.step = niceStep(Math.max.apply(null, s.vals.slice(0, p.last + 1).concat([0])), !alim); s.top = s.step * 4; });
  const Y = (s, v) => T + ph - (v / s.top) * ph;
  let g = '';
  for (let j = 0; j <= 4; j++) {
    const y = T + ph - j * ph / 4;
    g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>';
    g += '<text x="' + (L - 6) + '" y="' + (y + 3.5) + '" text-anchor="end"' + (alim ? ' style="fill:' + series[0].color + '"' : '') + '>' + fmtQ(j * series[0].step) + '</text>';
    if (alim) g += '<text x="' + (W - R + 6) + '" y="' + (y + 3.5) + '" style="fill:' + series[1].color + '">' + fmtQ(j * series[1].step) + '</text>';
  }
  if (alim) {
    g += '<text x="' + (L - 6) + '" y="10" text-anchor="end" style="fill:' + series[0].color + ';font-weight:700">ml</text>';
    g += '<text x="' + (W - R + 6) + '" y="10" style="fill:' + series[1].color + ';font-weight:700">g</text>';
  }
  for (let i = 0; i < p.n; i++) { const lb = p.label(i); if (lb) g += '<text x="' + X(i) + '" y="' + (H - 9) + '" text-anchor="middle">' + lb + '</text>'; }
  if (st.sel != null && st.sel <= p.last) g += '<rect class="selcol" x="' + (L + st.sel * cw) + '" y="' + T + '" width="' + cw + '" height="' + ph + '" rx="4"/>';
  const rad = p.n > 20 ? 3.5 : 5;
  series.forEach((s, si) => {
    const pts = [];
    for (let i = 0; i <= p.last; i++) pts.push([X(i), Y(s, s.vals[i])]);
    if (pts.length > 1) g += '<polyline class="ln" style="stroke:' + (alim ? s.color : 'var(--soft)') + '" points="' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/>';
    pts.forEach((q, i) => {
      let fill = s.color, extra = '';
      if (!alim) {
        const c = dominantColor(st.key, B[i].items);
        if (!B[i].items.length) { g += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.5" class="emp"/>'; return; }
        fill = c ? colorHex(st.key, c) : 'var(--soft)';
        extra = ' class="dt"';
      } else if (!s.vals[i]) { g += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2" style="fill:' + s.color + '"/>'; return; }
      g += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + rad + '" style="fill:' + fill + '"' + extra + '/>';
    });
  });
  for (let i = 0; i <= p.last; i++) g += '<rect class="hit" x="' + (L + i * cw) + '" y="' + T + '" width="' + cw + '" height="' + ph + '" data-act="spoint" data-i="' + i + '"/>';
  const descr = alim ? 'Courbes du biberon en ml et du mangé en g' : 'Courbe du nombre de ' + STATS[st.key].title.toLowerCase() + 's';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + descr + '">' + g + '</svg>';
}

function statDetail(st, p, B) {
  if (st.sel == null || st.sel > p.last) return '<p class="soft hint">Touchez un point de la courbe pour voir le détail.</p>';
  const b = B[st.sel], items = b.items;
  const pre = it => { const d = new Date(it.occurred_at); return st.scale === 'year' ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + hhmm(d) : hhmm(d); };
  let html = '<h3>' + esc(p.btitle(st.sel)) + '</h3>';
  if (!items.length) return html + '<p class="soft">Aucune entrée sur cette période.</p>';
  let rows;
  if (st.key === 'alim') {
    html += '<div class="kv"><span>🍼 Biberon</span><b>' + fmtQ(sumOf(items, 'quantity_drunk')) + ' ml</b></div>' +
      '<div class="kv"><span>🥣 Mangé</span><b>' + fmtQ(sumOf(items, 'quantity_eaten')) + ' g</b></div>';
    rows = items.map(it => '<div class="dl"><span class="t">' + pre(it) + '</span><span>' +
      [it.quantity_drunk != null ? 'biberon ' + fmtQ(it.quantity_drunk) + ' ml' : '', it.quantity_eaten != null ? 'mangé ' + fmtQ(it.quantity_eaten) + ' g' : ''].filter(Boolean).join(' · ') + '</span></div>');
  } else {
    const c = dominantColor(st.key, items), noun = STATS[st.key].title.toLowerCase();
    html += '<div class="kv"><span>' + items.length + ' ' + noun + (items.length > 1 ? 's' : '') + '</span>' +
      (c ? '<span>Couleur affichée : <span class="dot" style="background:' + colorHex(st.key, c) + '"></span><b>' + esc(c) + '</b></span>' : '') + '</div>';
    rows = items.map(it => '<div class="dl"><span class="t">' + pre(it) + '</span><span>' +
      (it.color ? '<span class="dot" style="background:' + colorHex(st.key, it.color) + '"></span>' + esc(it.color) : '<span class="soft">couleur non renseignée</span>') +
      (it.texture ? ' · ' + esc(it.texture) : '') + '</span></div>');
  }
  const cap = 40;
  return html + rows.slice(0, cap).join('') + (rows.length > cap ? '<p class="soft">… et ' + (rows.length - cap) + ' autres</p>' : '');
}

/* Température : chaque mesure est un point à sa date et heure, deux repères à 36,5 et 37,5 °C */
function tempCard(st, p) {
  const W = 360, H = 230, L = 40, R = 14, T = 16, Bm = 28, pw = W - L - R, ph = H - T - Bm;
  const vals = st.items.map(it => Number(it.temperature)).filter(v => isFinite(v));
  const lo = Math.floor((Math.min.apply(null, vals.concat([36.5])) - 0.2) * 2) / 2;
  const hi = Math.ceil((Math.max.apply(null, vals.concat([37.5])) + 0.2) * 2) / 2;
  const step = hi - lo > 4 ? 1 : 0.5;
  const Y = v => T + ph - ((v - lo) / (hi - lo)) * ph;
  const span = p.end - p.start;
  const X = d => L + ((d - p.start) / span) * pw;
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>' +
      '<text x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end">' + fmtQ(v) + '</text>';
  }
  [36.5, 37.5].forEach(v => { g += '<line class="ref" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>'; });
  for (let i = 0; i < p.n; i++) { const lb = p.label(i); if (lb) g += '<text x="' + (L + (i + 0.5) / p.n * pw) + '" y="' + (H - 9) + '" text-anchor="middle">' + lb + '</text>'; }
  const pts = st.items.map((it, i) => ({ i: i, x: X(new Date(it.occurred_at)), y: Y(Number(it.temperature)) }))
    .filter(q => isFinite(q.y) && q.x >= L - 1 && q.x <= W - R + 1);
  if (pts.length > 1) g += '<polyline class="ln" style="stroke:var(--temperature)" points="' + pts.map(q => q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' ') + '"/>';
  pts.forEach(q => {
    if (st.sel === q.i) g += '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="9" class="ring"/>';
    g += '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="4.5" class="dt" style="fill:var(--temperature)"/>';
    g += '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="12" class="hit" data-act="spoint" data-i="' + q.i + '"/>';
  });
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Courbe des températures en degrés Celsius, avec des repères à 36,5 et 37,5">' + g + '</svg>';
  const nn = st.items.length;
  const long = it => { const d = new Date(it.occurred_at); return fr(d, { weekday: 'long', day: 'numeric', month: 'long' }) + ' à ' + hhmm(d); };
  let detail;
  if (st.sel != null && st.items[st.sel]) {
    const it = st.items[st.sel];
    detail = '<h3>' + fmtQ(it.temperature) + ' °C</h3><p class="soft" style="margin:0">' + esc(long(it)) + '</p>' +
      (it.comment ? '<p style="margin:6px 0 0">« ' + esc(it.comment) + ' »</p>' : '');
  } else {
    detail = '<p class="soft hint">' + (nn ? 'Touchez un point de la courbe pour voir la mesure.' : 'Aucune température sur cette période.') + '</p>';
  }
  const list = st.items.map((it, i) => ({ it: it, i: i })).reverse().slice(0, 40).map(q =>
    '<button class="dl tl' + (st.sel === q.i ? ' on' : '') + '" data-act="spoint" data-i="' + q.i + '"><span class="t">' + esc(fr(new Date(q.it.occurred_at), { day: 'numeric', month: 'short' })) + ' ' + hhmm(new Date(q.it.occurred_at)) +
    '</span><b>' + fmtQ(q.it.temperature) + ' °C</b></button>').join('');
  return '<div class="chartcard"><div class="legend"><b>' + nn + ' mesure' + (nn > 1 ? 's' : '') + '</b><span><i style="background:var(--temperature)"></i>Température (°C)</span><span>traits : 36,5 et 37,5 °C</span></div>' + svg + '</div>' +
    '<div class="card detail">' + detail + '</div>' +

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Conversion de la photo impossible')), 'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Photo illisible")); };
    img.src = url;
  });
}
document.addEventListener('change', async ev => {
  const inp = ev.target;
  if (!inp.matches || !inp.matches('input[data-photo]')) return;
  const file = inp.files && inp.files[0];
  if (!file) return;
  try {
    const blob = await shrinkImage(file);
    setPhoto({ blob: blob, url: URL.createObjectURL(blob) });
  } catch (err) {
    log('Photo : ' + err.message);
    toast("Cette photo n'a pas pu être lue, essayez-en une autre", 'err');
  }
});
async function uploadPhoto(path, blob) {

/* ===== Chargement des données ===== */
function cacheSave() { store.set('popot-cache', { familyId: S.familyId, code: S.code, children: S.children, childId: S.childId }); }

async function loadChildren() {
  const r = await S.sb.from('children').select('*').eq('family_id', S.familyId).order('created_at');
  if (r.error) throw r.error;
  S.children = r.data || [];
  if (!S.children.find(c => c.id === S.childId)) S.childId = store.get('popot-child', null);
  if (!S.children.find(c => c.id === S.childId)) S.childId = S.children.length ? S.children[0].id : null;
  cacheSave();
}

async function loadToday() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const r = await S.sb.from('entries').select('*').eq('family_id', S.familyId)
    .gte('occurred_at', start.toISOString()).order('occurred_at', { ascending: false });
  if (r.error) throw r.error;
  const ids = new Set((r.data || []).map(x => x.id));
  const pending = S.queue.filter(x => x.family_id === S.familyId && new Date(x.occurred_at) >= start && !ids.has(x.id));
  S.today = (r.data || []).concat(pending).sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at));
}

async function loadHistory(mode) {
  const H = S.hist;
  H.loading = true;
  try {
    let q = S.sb.from('entries').select('*').eq('family_id', S.familyId);
    if (H.childId) q = q.eq('child_id', H.childId);
    if (H.kind !== 'all') q = q.eq('kind', H.kind);
    if (H.day) {
      const s = new Date(H.day + 'T00:00:00'), e = new Date(s);
      e.setDate(e.getDate() + 1);
      q = q.gte('occurred_at', s.toISOString()).lt('occurred_at', e.toISOString());
    }
    const from = mode === 'more' ? H.items.length : 0;
    const size = mode === 'reload' ? Math.max(PAGE, H.items.length) : PAGE;
    const r = await q.order('occurred_at', { ascending: false }).range(from, from + size - 1);
    if (r.error) throw r.error;
    H.items = mode === 'more' ? H.items.concat(r.data) : r.data;
    H.more = r.data.length === size;
  } catch (err) {
    fail(err, "Chargement de l'historique");
  }
  H.loading = false;
}

async function refreshData() {
  if (!S.familyId) return;
  try {
    await Promise.all([loadChildren(), loadToday()]);
    if (S.view === 'history') await loadHistory('reload');
    if (S.view === 'stats') await loadStat(true);
    S.offline = false;
  } catch (err) {
    const f = frError(err);
    if (f.kind === 'offline' || f.kind === 'down') { S.offline = true; log('Actualisation impossible : ' + f.text, err && err.message); }
    else fail(err, 'Actualisation des données');
  }
  render();
}

/* ===== Envoi des entrées (avec file d'attente hors connexion) ===== */
function saveQueue() { store.set('popot-queue', S.queue); }

async function flushQueue() {
  if (flushing || !S.queue.length || !S.familyId) return;
  flushing = true;
  try {
    for (const row of S.queue.slice()) {
      const r = await S.sb.from('entries').insert(row);
      if (r.error && r.error.code !== '23505') {
        const f = frError(r.error);
        if (['offline', 'down', 'quota', 'auth'].includes(f.kind)) { log("Envoi différé impossible : " + f.text, r.error.message); break; }
        log("Une entrée en attente a été abandonnée : " + f.text, r.error.message);
      }
      S.queue = S.queue.filter(x => x.id !== row.id);
      saveQueue();
    }
  } finally {
    flushing = false;
    renderBanner();
    refreshData();
  }
}

async function addEntry(row) {
  row.id = uuid();
  const r = await S.sb.from('entries').insert(row);
  if (!r.error || r.error.code === '23505') return { ok: true };
  const f = frError(r.error);
  if (f.kind === 'offline' || f.kind === 'down') {
    S.queue.push(row); saveQueue();
    log('Entrée gardée en attente : ' + f.text, r.error.message);
    return { ok: true, queued: true };
  }
  fail(r.error, "Ajout d'une entrée");
  return { ok: false };
}

async function saveForm() {
  const f = S.form;
  if (!f || !S.childId) return;
  const btn = $('#saveBtn');
  btn.disabled = true;
  const when = $('#when').value;
  const d = when ? new Date(when) : new Date();
  if (isNaN(d.getTime())) { toast('Heure invalide', 'err'); btn.disabled = false; return; }
  const row = { family_id: S.familyId, child_id: S.childId, kind: f.kind, occurred_at: d.toISOString(), comment: $('#comment').value.trim() || null };
  if (f.kind === 'temperature') {
    const tv = numOrNull($('#qTemp').value);
    if (tv == null || tv < 30 || tv > 45) { toast('Saisissez une température entre 30 et 45 °C (ex. 37,5)', 'err'); btn.disabled = false; return; }
    row.temperature = tv;
  } else if (f.kind === 'biberon') { row.quantity_drunk = numOrNull($('#qDrunk').value); row.quantity_eaten = numOrNull($('#qEaten').value); }
  else {
    row.color = f.color;
    if (f.kind === 'caca') row.texture = f.texture;
    if (f.kind === 'vomi') row.texture = f.level ? VLEVELS[f.level - 1] : null;
  }
  if (f.editId) { await saveEdit(f, row); btn.disabled = false; return; }
  let photoNote = null;
  if (S.photo) {
    if (!navigator.onLine) photoNote = 'Hors connexion : l\'entrée est enregistrée sans la photo';
    else {
      const path = S.familyId + '/' + uuid() + '.jpg';
      const perr = await uploadPhoto(path, S.photo.blob);
      if (perr) { log("Photo non envoyée : " + frError(perr).text, perr.message); photoNote = "La photo n'a pas pu être envoyée (voir le journal), l'entrée est enregistrée sans elle"; }
      else row.photo_path = path;
    }
  }
  const r = await addEntry(row);
  if (!r.ok && row.photo_path) S.sb.storage.from('photos').remove([row.photo_path]);
  btn.disabled = false;
  if (!r.ok) return;
  setPhoto(null);
  closeSheet();
  if (r.queued) {
    S.today = [row].concat(S.today).sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at));
    S.offline = !navigator.onLine;
    toast('Enregistré sur ce téléphone, il sera envoyé dès que la connexion revient');
    render();
  } else {
    if (photoNote) toast(photoNote, 'err'); else toast('Ajouté ✔');
    await refreshData();
  }
}

/* Modification d'une entrée déjà enregistrée */
async function saveEdit(f, row) {
  const id = f.editId;
  const payload = { occurred_at: row.occurred_at, comment: row.comment, color: null, texture: null, quantity_drunk: null, quantity_eaten: null, temperature: null };
  ['color', 'texture', 'quantity_drunk', 'quantity_eaten', 'temperature'].forEach(k => { if (row[k] !== undefined) payload[k] = row[k]; });
  // entrée encore en attente d'envoi sur ce téléphone : on modifie la copie locale
  const q = S.queue.find(x => x.id === id);
  if (q) {
    Object.assign(q, payload); saveQueue();
    const t = S.today.find(x => x.id === id); if (t) Object.assign(t, payload);
    S.today.sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at));
    setPhoto(null); closeSheet(); toast('Modifié ✔'); render(); return;
  }
  if (!navigator.onLine) { toast('Modification impossible hors connexion, réessayez quand le réseau revient', 'err'); return; }
  let photoNote = null, oldToRemove = null;
  if (S.photo) {
    const path = S.familyId + '/' + uuid() + '.jpg';
    const perr = await uploadPhoto(path, S.photo.blob);
    if (perr) { log('Photo non envoyée : ' + frError(perr).text, perr.message); photoNote = "La photo n'a pas pu être envoyée (voir le journal), le reste est modifié"; }
    else { payload.photo_path = path; oldToRemove = f.photoPath; }
  } else if (f.photoGone && f.photoPath) { payload.photo_path = null; oldToRemove = f.photoPath; }
  const r = await S.sb.from('entries').update(payload).eq('id', id);
  if (r.error) {
    if (payload.photo_path) S.sb.storage.from('photos').remove([payload.photo_path]);
    return fail(r.error, "Modification d'une entrée");
  }
  if (oldToRemove) S.sb.storage.from('photos').remove([oldToRemove]);
  setPhoto(null);
  closeSheet();
  if (photoNote) toast(photoNote, 'err'); else toast('Modifié ✔');
  await refreshData();
}

async function deleteEntry(id) {
  if (!confirm("Supprimer définitivement cette entrée ?\nCette action est irréversible.")) return;
  const old = findEntry(id);
  const r = await S.sb.from('entries').delete().eq('id', id);
  if (r.error) return fail(r.error, "Suppression d'une entrée");
  if (old && old.photo_path) S.sb.storage.from('photos').remove([old.photo_path]);
  closeSheet();
  toast('Entrée supprimée');
  await refreshData();
}

/* ===== Famille : créer, rejoindre, partager, quitter ===== */
async function createFamily() {
  const name = $('#newName').value.trim();
  const r = await S.sb.rpc('create_family', { p_first_name: name || null });
  if (r.error) return fail(r.error, 'Création de la famille');
  const row = Array.isArray(r.data) ? r.data[0] : r.data;
  S.familyId = row.out_family_id;
  S.code = row.out_code;
  try { await enterFamily(); } catch (err) { return fail(err, 'Chargement de la famille'); }
  render();
  codeSheet(true);
}

async function joinFamily() {
  const code = $('#joinCode').value.trim().toUpperCase().replace(/\s+/g, '');
  if (code.length < 4) return toast('Saisissez le code famille', 'err');
  const r = await S.sb.rpc('join_family', { p_code: code });
  if (r.error) return fail(r.error, 'Rejoindre une famille');
  try { await loadFamily(); } catch (err) { return fail(err, 'Chargement de la famille'); }
  render();
  toast('Bienvenue dans la famille ✔');
}

async function shareCode() {
  const text = 'Rejoins notre famille sur PoPoT 👶\nCode famille : ' + S.code + '\n' + location.href.split('#')[0];
  if (navigator.share) {
    try { await navigator.share({ text: text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  location.href = 'sms:?&body=' + encodeURIComponent(text);
}

async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch (e2) { toast('Copie impossible sur ce téléphone', 'err'); }
    ta.remove();
  }
}

async function leaveFamily() {
  const extra = S.queue.length ? '\n' + S.queue.length + ' entrée(s) en attente d\'envoi seront perdues.' : '';
  if (!confirm('Se déconnecter de cette famille sur ce téléphone ?\nVous pourrez la rejoindre à nouveau avec son code.' + extra)) return;
  if (S.user) {
    const r = await S.sb.from('family_members').delete().eq('user_id', S.user.id).eq('family_id', S.familyId);
    if (r.error) return fail(r.error, 'Déconnexion de la famille');
  }
  if (S.channel) { S.sb.removeChannel(S.channel); S.channel = null; }
  S.familyId = null; S.code = null; S.children = []; S.childId = null; S.today = []; S.queue = [];
  saveQueue(); store.del('popot-cache'); store.del('popot-child'); store.del('popot-code');
  S.view = 'welcome';
  closeSheet();
  render();
}

async function addChild() {
  const name = prompt("Prénom du nouvel enfant (laisser vide pour rester anonyme)", '');
  if (name === null) return;
  const r = await S.sb.from('children').insert({ family_id: S.familyId, first_name: name.trim() || null }).select().single();
  if (r.error) return fail(r.error, "Ajout d'un enfant");
  S.childId = r.data.id; store.set('popot-child', S.childId);
  closeSheet();
  toast('Enfant ajouté ✔');
  await refreshData();
}

async function renameChild(id) {
  const c = S.children.find(x => x.id === id);
  if (!c) return;
  const name = prompt('Prénom de ' + c.label + ' (laisser vide pour rester anonyme)', c.first_name || '');
  if (name === null) return;
  const r = await S.sb.from('children').update({ first_name: name.trim() || null }).eq('id', id);
  if (r.error) return fail(r.error, "Modification d'un prénom");
  closeSheet();
  await refreshData();
}

/* ===== Démarrage ===== */
async function boot() {
  S.view = 'loading'; render();
  try {
    if (!S.sb) {
      if (!window.supabase) throw new Error('Failed to fetch (bibliothèque non chargée)');
      S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
      S.sb.auth.onAuthStateChange(ev => {
        if (ev === 'SIGNED_OUT' && S.familyId && !S.rebooting) {
          S.rebooting = true;
          log('Info : la connexion a expiré, reconnexion automatique');
          boot().then(() => { S.rebooting = false; }, () => { S.rebooting = false; });
        }
      });
    }
    const g = await S.sb.auth.getSession();
    let session = g.data && g.data.session;
    if (g.error && !session) {
      const f0 = frError(g.error);
      if (f0.kind === 'offline' || f0.kind === 'down') throw g.error;
      log('Info : la connexion mémorisée sur ce téléphone était inutilisable, nouvelle connexion automatique', g.error.message);
    }
    if (!session) {
      const a = await S.sb.auth.signInAnonymously();
      if (a.error) throw a.error;
      session = a.data.session;
      log('Info : nouvelle connexion automatique créée sur ce téléphone');
    }
    S.user = session.user;
    await loadFamily();
    if (S.view === 'welcome') {
      const saved = store.get('popot-code', null);
      if (saved) {
        const j = await S.sb.rpc('join_family', { p_code: saved });
        if (j.error) {
          if (frError(j.error).kind === 'code') { store.del('popot-code'); log("Info : le code famille mémorisé n'existe plus"); }
          else throw j.error;
        } else {
          log('Info : famille retrouvée automatiquement grâce au code mémorisé');
          await loadFamily();
        }
      }
    }
  } catch (err) {
    const f = frError(err), c = store.get('popot-cache', null);
    log('Démarrage : ' + f.text, err && err.message);
    if ((f.kind === 'offline' || f.kind === 'down') && c && c.familyId) {
      S.familyId = c.familyId; S.code = c.code; S.children = c.children || []; S.childId = c.childId;
      S.view = 'dashboard'; S.offline = true;
      toast(f.text, 'err');
    } else {
      S.view = 'error'; S.errText = f.text;
    }
  }
  render();
}

/* ===== Clics et saisies ===== */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'retry': boot(); break;
    case 'create': el.disabled = true; await createFamily(); el.disabled = false; break;
    case 'join': el.disabled = true; await joinFamily(); el.disabled = false; break;
    case 'add':
      if (!S.childId) { toast("Aucun enfant dans cette famille", 'err'); break; }
      formSheet(el.dataset.kind); break;
    case 'child':
      S.childId = el.dataset.id; store.set('popot-child', S.childId); cacheSave(); render();
      if (S.view === 'stats') { S.stat.sel = null; await loadStat(); }
      break;
    case 'menu': openMenu(); break;
    case 'menuclose': closeMenu(); break;
    case 'gohome': closeMenu(); S.view = 'dashboard'; render(); break;
    case 'stat': await openStat(el.dataset.key); break;
    case 'sscale': S.stat.scale = el.dataset.s; S.stat.offset = 0; S.stat.sel = null; await loadStat(); break;
    case 'sprev': S.stat.offset -= 1; S.stat.sel = null; await loadStat(); break;
    case 'snext': if (S.stat.offset < 0) { S.stat.offset += 1; S.stat.sel = null; await loadStat(); } break;
    case 'sretry': await loadStat(); break;
    case 'spoint': S.stat.sel = Number(el.dataset.i); render(); break;
    case 'settings': settingsSheet(); break;
    case 'history':
      S.view = 'history';
      S.hist = { items: [], more: false, loading: true, kind: 'all', childId: S.children.length > 1 ? S.childId : null, day: '' };
      render(); await loadHistory('fresh'); render(); break;
    case 'back': S.view = 'dashboard'; render(); break;
    case 'hchild': S.hist.childId = el.dataset.id || null; render(); await loadHistory('fresh'); render(); break;
    case 'hkind': S.hist.kind = el.dataset.kind; render(); await loadHistory('fresh'); render(); break;
    case 'hclear': S.hist.day = ''; render(); await loadHistory('fresh'); render(); break;
    case 'more': el.disabled = true; await loadHistory('more'); render(); break;
    case 'color':
      if (S.form) {
        S.form.color = S.form.color === el.dataset.name ? null : el.dataset.name;
        document.querySelectorAll('.swb').forEach(b => b.classList.toggle('on', b.dataset.name === S.form.color));
      }
      break;
    case 'texture':
      if (S.form) {
        S.form.texture = S.form.texture === el.dataset.name ? null : el.dataset.name;
        document.querySelectorAll('[data-act="texture"]').forEach(b => b.classList.toggle('on', b.dataset.name === S.form.texture));
      }
      break;
    case 'vlevel':
      if (S.form) { const n = Number(el.dataset.n); S.form.level = S.form.level === n ? 0 : n; paintLevel(); }
      break;
    case 'edit': { const ee = findEntry(el.dataset.id); if (ee) { closeSheet(); formSheet(ee.kind, ee); } break; }
    case 'save': await saveForm(); break;
    case 'open': { entrySheet(el.dataset.id); const pe = findEntry(el.dataset.id); if (pe && pe.photo_path) showEntryPhoto(pe.photo_path); break; }
    case 'photoremove':
      if (S.photo) setPhoto(null);
      else if (S.form) { S.form.photoGone = true; const bx = $('#photoBox'); if (bx) bx.innerHTML = photoPicker(); }
      break;
    case 'delete': await deleteEntry(el.dataset.id); break;
    case 'share': await shareCode(); break;
    case 'copy': await copyText(S.code, 'Code copié'); break;
    case 'logs': logsSheet(); break;
    case 'copylog': await copyText(todayLog().map(i => hhmm(new Date(i.t)) + ' ' + i.text + (i.tech ? ' [' + i.tech + ']' : '')).join('\n'), 'Journal copié'); break;
    case 'addchild': await addChild(); break;
    case 'rename': await renameChild(el.dataset.id); break;
    case 'leave': await leaveFamily(); break;
  }
});

document.addEventListener('change', async ev => {
  if (ev.target && ev.target.id === 'hday') {
    S.hist.day = ev.target.value || '';
    render(); await loadHistory('fresh'); render();
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'joinCode') { ev.preventDefault(); joinFamily(); }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'newName') { ev.preventDefault(); createFamily(); }
  if (ev.key === 'Escape') closeSheet();
});

window.addEventListener('online', () => { renderBanner(); flushQueue(); refreshData(); });
window.addEventListener('offline', renderBanner);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.familyId) { flushQueue(); refreshData(); } });

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* rien */ }
todayLog();
boot();
})();
</script>
